[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Forge — AI-native game engine & editor"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.29", features = ["serde"] }
rhai = { version = "1", features = ["f32_float"] }
ureq = { version = "2", features = ["json"] }
dirs = "6"
dotenvy = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
tar = "0.4"
egui_dock = { version = "0.16", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
rodio = "0.20"
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
